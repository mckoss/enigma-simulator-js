<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Enigma Machine Simulator</title>
<link rel="stylesheet" type="text/css" href="/enigma-sim.css"/>
</head>
<body>
<div class="page">

<h1>Enigma Machine Simulator</h1>
<p style="color:gray;">by Mike Koss <small id="app-version"></small></p>
<hr/>

<div class="left">
	<fieldset id="init_form">
		<legend>Initialization</legend>
		<ol>
			<li>
				<label for="rotors">Rotors:</label>
				<input type="text" id="rotors"/>
			</li>
			<li>
				<label for="position">Rotor Start:</label>
				<input type="text" id="position"/>
			</li>
			<li>
				<label for="rings">Rings:</label>
				<input type="text" id="rings"/>
			</li>
			<li>
				<label for="plugs">Plugboard:</label>
				<input type="text" id="plugs"/>
			</li>
			<li>
				<label for="passkey"></label>
				<input type="button" id="passkey" value="Set from passkey"/>
			</li>
		</ol>
		<p id="settings-error" role="alert"></p>
	</fieldset>
	<p>
	To learn more about the <a target="_blank" href="https://en.wikipedia.org/wiki/Enigma_machine">Enigma Machine</a>,
	try using the <a target="_blank" href="https://mckoss.com/posts/paper-enigma/">Paper Engima</a>.  You
	can also read the <a target="_blank" href="https://github.com/mckoss/enigma-simulator-js">source code</a>
	used by this Enigma Simulator.
	</p>
	<a target="_blank" href="https://en.wikipedia.org/wiki/Enigma_machine"><img src="images/mycryptos.jpg"/></a>
	<a target="_blank" href="https://mckoss.com/posts/paper-enigma/"><img src="images/EnigmaThumb.jpg"/></a>
</div>

<div class="right">
	<fieldset id="encoding">
		<legend>Encoding</legend>
		<ol>
			<li id="rotor_display">
				<span id="rot_1"></span><span id="rot_2"></span><span id="rot_3"></span>
			</li>
			<li>
				<label class="box" for="plain">Type Message Here:</label>
				<textarea class="text-input" id="plain">QMJIDO MZWZJFJR</textarea>
			</li>
			<li>
				<label class="box" for="cipher">Read Output Here:</label>
				<div id="cipher"><span id="key_out"></span><span id="cipher_out"></span></div>
			</li>
			<li>
				<input id="keep_spacing" type="checkbox" checked/>
				<label for="keep_spacing">Preserve spacing</label>

			</li>
		</ol>
	</fieldset>
</div>




</div> <!-- page -->
<script type="module" src="/src/main.ts"></script>
</body>
</html>
