<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Enigma Machine Simulator</title>
<link rel="stylesheet" type="text/css" href="/enigma-sim.css"/>
</head>
<body>
<div class="page">

<h1>Enigma Machine Solver</h1>
<p style="color:gray;">by Mike Koss <small id="app-version"></small></p>
<hr/>

<fieldset id="input_form">
	<legend>Rotor Search</legend>
	<ol>
		<li>
			<label class="box" for="text_input">Enter Coded Message Here:</label>
			<textarea class="text-input" id="text_input">QMJIDO MZWZJFJR</textarea>
		</li>
		<li>
			<label for="solve"></label>
			<input type="button" id="solve" value="Solve It"/>
		</li>
	</ol>
</fieldset>
<p id="solver-output" role="status" aria-live="polite"></p>

</div>

<script type="module" src="/src/solver.ts"></script>
</body>
</html>
